    inner_crust_template_generator: scripts/fit_inner_crust_reference_template.py
    inner_crust_validation_runner: scripts/run_inner_crust_validation.py
    contract: ns_eos_low_density_contract_v0_5.yaml
    review: NS_EOS_LOW_DENSITY_REVIEW_V0_5.md
    inner_crust_connector_internal_validation: PASSED
    inner_crust_connector_external_local_shape_validation: PASSED
    inner_crust_connector_external_calibration_model: IOPB
    inner_crust_connector_external_primary_holdout: G3
    inner_crust_connector_external_secondary_holdout: FSUGarnet
    inner_crust_endpoint_exponential_v0_4: REJECTED
    inner_crust_reference_tilted_v0_5: ACCEPTED_FOR_CONTINUED_DEVELOPMENT_ONLY
    inner_crust_stellar_impact_validation: PENDING
    scientific_outer_crust_tables_embedded: true
